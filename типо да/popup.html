<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #fff;
      color: #333;
    }
    .header {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 25px 20px 10px 20px;
    }
    .settings-icon {
      position: absolute;
      top: 12px;
      right: 15px;
      cursor: pointer;
      font-size: 12px;
      opacity: 0.5;
      transition: opacity 0.2s;
      user-select: none;
    }
    .settings-icon:hover { opacity: 0.9; }
    .avatar-container {
      width: 95px;
      height: 95px;
      background-color: #FFFFFF;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0px 0px rgba(30, 136, 229, 0.35);
    }
    .avatar-container img {
      width: 150px;
      height: 150px;
      object-fit: contain;
    }
    .title {
      color: #FFFFFF;
      font-size: 19px;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
    }
    .status-list {
      width: 100%;
      padding: 0 24px;
      box-sizing: border-box;
    }
    .status-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .status-text {
      font-size: 13px;
      line-height: 1.4;
      color: #2c2c2c;
      font-weight: 500;
    }
    .status-subtext {
      font-size: 11px;
      color: #888;
      margin-top: 3px;
      user-select: none;
    }
    .check-icon {
      color: #1e88e5;
      font-size: 16px;
      font-weight: bold;
      margin-left: 10px;
    }
    .footer {
      background-color: #e3f2fd;
      padding: 12px 20px;
      font-size: 12px;
      color: #1565c0;
      border-top: 1px solid #bbdefb;
      line-height: 1.4;
    }
    .footer a {
      color: #1565c0;
      text-decoration: none;
      font-weight: bold;
    }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="header">
    <div class="settings-icon" id="open-settings" title="Открыть настройки">⚙️</div>
    <div class="avatar-container">
      <img src="icon.png" alt="Logo">
    </div>
    <div class="title">ЖЕКА КАСТОМИЗАЦИЯ</div>
  </div>

  <div class="status-list">
    <div class="status-item">
      <div>
        <div class="status-text">Загрузка файлов — на странице настроек</div>
        <div class="status-subtext">fortport.ru/settings</div>
      </div>
      <div class="check-icon">✓</div>
    </div>

    <div class="status-item">
      <div>
        <div class="status-text">Файлы хранятся локально</div>
        <div class="status-subtext">в браузере</div>
      </div>
      <div class="check-icon">✓</div>
    </div>
  </div>

  <div class="footer">
    <a href="#" id="link-settings">Открыть настройки</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
